<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Iniciar sesión — LAS NY CONSTRUCCION COMPANY</title>
<style>
  :root{
    --azul-oscuro:#1F4E79;
    --azul:#3E6DA6;
    --azul-claro:#DCE6F5;
    --rojo:#C0392B;
    --gris-100:#F7F8FA;
    --gris-200:#E7E9ED;
    --gris-400:#B9BEC7;
    --gris-600:#6B7280;
    --gris-800:#2B2F36;
    --blanco:#FFFFFF;
    --radio:10px;
    --sombra:0 1px 3px rgba(17,24,39,.08), 0 1px 2px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--gris-100);
    color:var(--gris-800);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .login-card{
    width:100%;max-width:360px;
    background:var(--blanco);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:28px 26px 24px;
    text-align:center;
  }
  .login-card img{width:120px;display:block;margin:0 auto 14px;}
  .login-card h1{
    margin:0 0 4px;font-size:16px;color:var(--azul-oscuro);font-weight:800;
  }
  .login-card p.sub{
    margin:0 0 22px;font-size:12px;color:var(--gris-600);
  }
  .field{margin-bottom:14px;text-align:left;}
  label{display:block;font-size:11.5px;color:var(--gris-600);margin-bottom:4px;font-weight:600;}
  .input-wrap{position:relative;}
  input[type=text], input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--gris-200);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    background:var(--blanco);
    color:var(--gris-800);
  }
  input:focus{outline:2px solid var(--azul);outline-offset:1px;border-color:var(--azul);}
  .toggle-pass{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--azul);font-size:11.5px;font-weight:700;
    cursor:pointer;padding:6px 8px;
  }
  .btn-login{
    width:100%;padding:13px;border-radius:10px;border:none;
    background:var(--azul-oscuro);color:#fff;font-weight:700;font-size:14.5px;
    cursor:pointer;margin-top:6px;
  }
  .btn-login:active{background:var(--azul);}
  .btn-login[disabled]{opacity:.6;cursor:default;}
  .error-msg{
    display:none;
    background:#FBE7E2;color:var(--rojo);
    border-radius:8px;padding:9px 10px;font-size:12.5px;font-weight:600;
    margin-bottom:14px;text-align:left;
  }
  .footer-empresa{
    margin-top:20px;font-size:11px;color:var(--gris-600);line-height:1.5;
  }
</style>
</head>

    <h1>Cotizador LAS NY</h1>
    <p class="sub">Ingresa tus datos para continuar</p>

    <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>

          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>

      </div>

  </div>

  const btnLogin = document.getElementById('btnLogin');
  const togglePass = document.getElementById('togglePass');
  const contrasena = document.getElementById('contrasena');

  togglePass.addEventListener('click', () => {

    contrasena.type = oculto ? 'text' : 'password';
    togglePass.textContent = oculto ? 'Ocultar' : 'Ver';
  });

  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || '/';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    btnLogin.disabled = true;
    btnLogin.textContent = 'Entrando…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          contrasena: contrasena.value
        })
      });
      if (res.ok) {
        location.href = redirectTo;
        return;
      }
      errorMsg.style.display = 'block';
    } catch (err) {
      errorMsg.textContent = 'No se pudo conectar. Intenta de nuevo.';
      errorMsg.style.display = 'block';
    }
    btnLogin.disabled = false;
    btnLogin.textContent = 'Entrar';
  });
</script>
</body>
</html>
